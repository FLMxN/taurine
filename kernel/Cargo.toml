[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kernel"
path = "src/taurine.rs"

[dependencies]
bootloader_api = "0.11.17"
const_env = "0.1.5"
heapless = "0.9.3"
pic8259 = "0.10"
rdrand = "0.9.0"
spin = "0.9"
x86_64 = "0.15"
core3 = { version = "0.1", default-features = false }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", branch = "master", default-features = false }
# core_io = { version = "0.1", default-features = false }

[build-dependencies]
dotenv = "0.15.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
