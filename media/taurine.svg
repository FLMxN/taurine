<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <title>Minimalist Logo</title>
  <desc>Квадрат с толстыми рамками, тонким знаком процента внутри и отростками по бокам</desc>

  <!-- Квадрат с толстой рамкой -->
  <rect x="20" y="20" width="60" height="60" rx="6"
        fill="none"
        stroke="rgb(225, 250, 245)"
        stroke-width="8" />

  <!-- Левый отросток -->
  <line x1="20" y1="50" x2="8" y2="50"
        stroke="rgb(225, 250, 245)"
        stroke-width="8"
        stroke-linecap="round" />

  <!-- Правый отросток -->
  <line x1="80" y1="50" x2="92" y2="50"
        stroke="rgb(225, 250, 245)"
        stroke-width="8"
        stroke-linecap="round" />

  <!-- Знак процента — тоньше -->
  <g fill="none"
     stroke="rgb(46, 247, 130)"
     stroke-width="4.5"
     stroke-linecap="round">
    <!-- Верхний левый кружок -->
    <circle cx="41" cy="41" r="5.5" />
    <!-- Нижний правый кружок -->
    <circle cx="59" cy="59" r="5.5" />
    <!-- Диагональная линия -->
    <line x1="62" y1="38" x2="38" y2="62" />
  </g>
</svg>